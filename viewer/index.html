<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iptv-myapp · local viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #0b0d10; color: #e6e9ee; display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { border-right: 1px solid #1f242c; display: flex; flex-direction: column; min-height: 0; }
  .bar { padding: 10px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #1f242c; }
  .bar input, .bar select { width: 100%; padding: 8px; background: #141821; color: inherit; border: 1px solid #2a313d; border-radius: 6px; }
  .bar input { grid-column: 1 / -1; }
  .bar label { display: flex; align-items: center; gap: 6px; color: #9aa3b2; font-size: 12px; }
  #count { padding: 4px 10px; color: #9aa3b2; font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #12161c; }
  li:hover, li.focus { background: #171c26; }
  li.active { background: #1c3a5e; }
  li img { width: 40px; height: 28px; object-fit: contain; background: #1a1f29; border-radius: 4px; flex: none; }
  li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .m { color: #8b95a7; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #3a4150; }
  .dot.ok { background: #38c172; } .dot.bad { background: #e3342f; } .dot.warn { background: #f6ad55; }
  main { display: flex; flex-direction: column; min-width: 0; }
  video { width: 100%; flex: 1; background: #000; min-height: 0; }
  #info { padding: 10px 14px; border-top: 1px solid #1f242c; display: flex; gap: 16px; align-items: center; color: #9aa3b2; font-size: 13px; }
  #info b { color: #e6e9ee; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; padding: 8px 14px; color: #8b95a7; border-top: 1px solid #1f242c; }
  .tag { padding: 2px 6px; border-radius: 4px; background: #1f2937; font-size: 11px; }
  button { background: #1f2937; color: inherit; border: 1px solid #2a313d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #ctrl, #streams { padding: 8px 14px; border-top: 1px solid #1f242c; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: #9aa3b2; font-size: 13px; }
  #streams:empty { display: none; }
  #ctrl .hint, #streams .hint { color: #6b7485; font-size: 12px; }
  #live, #streams button { display: flex; align-items: center; gap: 6px; }
  #live.on { border-color: #e3342f; color: #fff; } #live.on .dot { background: #e3342f; }
  #streams button small { color: #8b95a7; }
  #streams button.on { background: #1c3a5e; border-color: #3b82f6; }
  #streams button.fail { border-color: #7f1d1d; color: #f87171; }
</style>
</head>
<body>
<aside>
  <div class="bar">
    <input id="q" placeholder="Search channels…  (↑↓ to move, Enter to play)" autocomplete="off">
    <select id="country"><option value="SQ">Albanian (AL + XK + sqi)</option><option value="">All countries</option></select>
    <select id="cat"><option value="">All categories</option></select>
    <label><input type="checkbox" id="aliveOnly" checked> alive only</label>
    <label><input type="checkbox" id="forceProxy"> always via proxy</label>
  </div>
  <div id="count"></div>
  <div style="padding:0 10px 8px;display:flex;flex-wrap:wrap;gap:6px"><button onclick="quick('SQ','')">🇦🇱 Albanian</button><button onclick="quick('','sports')">⚽ Sports (all countries)</button><button onclick="quick('','news')">📰 News</button><button onclick="quickSource('rakuten')">🎬 Rakuten (free in AL)</button><button onclick="quick('','radio')">📻 Radio</button></div>
  <ul id="list"></ul>
</aside>
<main>
  <video id="v" controls autoplay playsinline></video>
  <div id="ctrl">
    <button id="pp" onclick="togglePlay()" title="Pause / play (Space). Play after a pause jumps to live.">⏸</button>
    <button onclick="seekBy(-30)" title="Back 30 s">⏪ 30s</button>
    <button onclick="seekBy(-10)" title="Back 10 s (←)">↺ 10s</button>
    <button onclick="seekBy(10)" title="Forward 10 s (→)">10s ↻</button>
    <button id="live" onclick="goLive()" title="Jump to live (L)" disabled><span class="dot"></span>LIVE</button>
    <span id="behind"></span>
    <span style="flex:1"></span>
    <span id="dvr" class="hint" title="How far back you can rewind from here; depends on how much the stream keeps"></span>
    <span class="hint">Space pause · ←/→ 10s · L live · 1–9 stream</span>
  </div>
  <div id="streams"></div>
  <div id="info"><span>Pick a channel on the left.</span></div>
  <div id="log"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js"></script>
<script>
const $ = s => document.querySelector(s);
const video = $('#v'), list = $('#list'), info = $('#info'), logEl = $('#log');
let all = [], view = [], hls = null, ts = null, active = null, focusIdx = 0;
let cur = null;           // what is playing: { c, streams, i, viaProxy, failed }
let pausedAt = 0;         // set when the user pauses a live stream; the next play jumps to live
let internalSeek = false;
const log = m => { logEl.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + logEl.textContent.split('\n').slice(0, 12).join('\n'); };
const ago = iso => { const m = (Date.now() - Date.parse(iso)) / 60000; return m < 60 ? `${Math.max(1, Math.round(m))} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
const recentOk = s => !!s.lastOk && Date.now() - Date.parse(s.lastOk) < 48 * 3600e3; // worked in the last 48 h: probably just off air for a while
const lastWorked = c => c.streams.map(s => s.lastOk).filter(Boolean).sort().pop();

fetch('/api/channels').then(r => r.json()).then(d => {
  all = d;
  const countries = [...new Set(all.map(c => c.country).filter(Boolean))].sort();
  for (const c of countries) $('#country').append(new Option(c, c));
  const cats = [...new Set(all.flatMap(c => c.categories))].sort();
  for (const c of cats) $('#cat').append(new Option(c, c));
  render();
});

// the server's background rechecker keeps statuses fresh: show when it last ran, and pull new statuses every 5 min
// into the loaded channels (same objects, so playback and the stream buttons are not disturbed)
let recheckInfo = '';
const showCount = () => { $('#count').textContent = `${view.length} channels${recheckInfo}`; };
async function loadRecheckInfo() {
  try {
    const r = await (await fetch('/api/rechecker')).json();
    const al = r.running.albanian ? 'checking Albanian now' : r.lastRun.albanian ? `Albanian checked ${ago(r.lastRun.albanian)}` : '';
    const full = r.running.full ? 'full check running' : r.lastRun.full ? `all checked ${ago(r.lastRun.full)}` : '';
    recheckInfo = [al, full].filter(Boolean).map(s => ` · ${s}`).join('');
    showCount();
  } catch {}
}
async function refreshStatuses() {
  try {
    const fresh = new Map((await (await fetch('/api/channels')).json()).map(c => [c.id, c]));
    for (const c of all) {
      const f = fresh.get(c.id); if (!f) continue;
      c.alive = f.alive; c.recent = f.recent;
      for (const s of c.streams) { const fs = f.streams.find(x => x.url === s.url); if (fs) Object.assign(s, { status: fs.status, checkedAt: fs.checkedAt, lastOk: fs.lastOk }); }
    }
    render(); if (cur) renderStreams();
  } catch {}
}
loadRecheckInfo(); setInterval(loadRecheckInfo, 60_000); setInterval(refreshStatuses, 5 * 60_000);

function render() {
  const q = $('#q').value.trim().toLowerCase(), co = $('#country').value, cat = $('#cat').value, aliveOnly = $('#aliveOnly').checked;
  view = all.filter(c => {
    if (aliveOnly && !c.alive && !c.recent) return false;
    if (c.isNsfw) return false;
    if (sourceFilter && !c.streams.some(s => s.source === sourceFilter)) return false;
    if (co === 'SQ') { if (!(c.country === 'AL' || c.country === 'XK' || c.languages.includes('sqi'))) return false; }
    else if (co && c.country !== co) return false;
    if (cat && !c.categories.includes(cat)) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (b.alive - a.alive) || (!!b.recent - !!a.recent) || a.name.localeCompare(b.name));
  showCount();
  list.innerHTML = '';
  const frag = document.createDocumentFragment();
  view.slice(0, 800).forEach((c, i) => {
    const li = document.createElement('li');
    const worked = !c.alive && lastWorked(c);
    li.innerHTML = `<span class="dot ${c.alive ? 'ok' : c.recent ? 'warn' : 'bad'}"></span><img loading="lazy" src="${c.logo ?? ''}" onerror="this.style.visibility='hidden'"><div class="n">${c.name}<div class="m">${c.country ?? '—'} · ${c.categories.join(', ') || '—'} · ${c.streams.length} stream${c.streams.length > 1 ? 's' : ''}${worked ? ` · worked ${ago(worked)}` : ''}</div></div>`;
    li.onclick = () => { focusIdx = i; play(c); };
    if (c === active) li.classList.add('active');
    frag.append(li);
  });
  list.append(frag);
  focusIdx = Math.min(focusIdx, Math.max(0, view.length - 1));
  highlight();
}
function highlight() { [...list.children].forEach((li, i) => li.classList.toggle('focus', i === focusIdx)); list.children[focusIdx]?.scrollIntoView({ block: 'nearest' }); }

const proxied = s => `/proxy?u=${encodeURIComponent(s.url)}${s.ua ? `&ua=${encodeURIComponent(s.ua)}` : ''}${s.ref ? `&ref=${encodeURIComponent(s.ref)}` : ''}`;

function play(c) {
  active = c; [...list.children].forEach((li, i) => li.classList.toggle('active', view[i] === c));
  const streams = [...c.streams].sort((a, b) => (b.status === 'ok') - (a.status === 'ok'));
  cur = { c, streams, i: 0, viaProxy: false, failed: new Set() };
  playStream(0);
}
// YouTube, rakuten://, plex://, broadcaster session players etc. resolve server-side
const needsProxy = s => $('#forceProxy').checked || !!(s.ua || s.ref) || !/^https?:/i.test(s.url) || /youtube\.com|youtu\.be/i.test(s.url);
const playStream = i => tryStream(cur.c, cur.streams, i, needsProxy(cur.streams[i]), i);
const reload = () => { log('↻ reconnecting at the live point'); tryStream(cur.c, cur.streams, cur.i, cur.viaProxy, cur.i); };

function renderStreams() {
  const box = $('#streams'); box.innerHTML = '';
  if (!cur) return;
  box.append(Object.assign(document.createElement('span'), { className: 'hint', textContent: 'Streams:' }));
  cur.streams.forEach((s, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="dot ${s.status === 'ok' ? 'ok' : recentOk(s) ? 'warn' : s.status ? 'bad' : ''}"></span>Stream ${i + 1} <small>${[s.quality, s.source].filter(Boolean).join(' · ')}</small>`;
    b.title = `${s.status ?? 'unchecked'}${s.checkedAt ? ` · checked ${ago(s.checkedAt)}` : ''}${s.lastOk && s.status !== 'ok' ? ` · last worked ${ago(s.lastOk)}` : ''} — ${s.url}`;
    b.classList.toggle('on', i === cur.i); b.classList.toggle('fail', cur.failed.has(i));
    b.onclick = () => playStream(i);
    box.append(b);
  });
}

function tryStream(c, streams, i, viaProxy, first) {
  const s = streams[i];
  const src = viaProxy ? proxied(s) : s.url;
  Object.assign(cur, { i, viaProxy, netRetries: 0, mediaRetries: 0 }); pausedAt = 0;
  if (hls) { hls.destroy(); hls = null; }
  if (ts) { ts.destroy(); ts = null; }
  video.onerror = null; video.removeAttribute('src'); video.removeAttribute('poster'); video.load();
  info.innerHTML = `<b>${c.name}</b> <span class="tag">${s.quality ?? '?'}</span> <span class="tag">${s.source}</span> <span class="tag">${viaProxy ? 'via proxy' : 'direct'}</span> <span class="tag">stream ${i + 1}/${streams.length}</span> <span class="tag">${s.status ?? 'unchecked'}</span> <span style="flex:1"></span><button onclick="navigator.clipboard.writeText('${s.url.replace(/'/g, '')}')">copy URL</button>`;
  renderStreams();
  log(`▶ ${c.name} — ${viaProxy ? 'proxy' : 'direct'} — ${s.url}`);
  const skip = reason => { // this stream is dead: next alternate URL, wrapping around until we are back where we started
    log(`✖ ${reason}`); cur.failed.add(i);
    const j = (i + 1) % streams.length;
    if (j === first) { renderStreams(); info.innerHTML = `<b>${c.name}</b> <span class="tag" style="background:#7f1d1d">all ${streams.length} stream(s) failed</span>`; return; }
    tryStream(c, streams, j, needsProxy(streams[j]), first);
  };
  const next = reason => {
    if (viaProxy) return skip(reason);
    log(`✖ ${reason}`); tryStream(c, streams, i, true, first); // same stream through proxy (fixes CORS / headers)
  };
  if (/^(rtmp|rtsp|srt|mms|mmsh):/i.test(s.url)) return skip(`${s.url.split(':')[0]} is not playable in a browser`);
  if (/\.mpd(\?|$)/i.test(s.url)) return skip('DASH not supported in this viewer (AVPlay handles it on the TV)');
  if (s.source === 'local-tuner' || /\.ts(\?|$)|\/auto\/v\d+|\/stream\/channel/i.test(s.url)) { // raw MPEG-TS over HTTP (tuner): mpegts.js
    if (!(window.mpegts && mpegts.isSupported())) return skip('MPEG-TS needs mpegts.js/MSE (AVPlay plays it natively on the TV)');
    // no latency chasing: it would undo rewinds; LIVE and play-after-pause re-sync instead
    ts = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: src }, { enableWorker: true });
    ts.on(mpegts.Events.ERROR, (t, d) => next(`mpegts ${t}: ${d}`)); ts.attachMediaElement(video); ts.load(); video.play().catch(() => {});
    log(`✓ MPEG-TS via mpegts.js`); return;
  }
  if (/twitch\.tv/i.test(s.url)) return skip('Twitch page, not supported');
  if (s.labels?.includes('Radio')) { // Icecast radio (MP3/AAC): the media element plays it directly, no CORS needed
    if (c.logo) video.poster = c.logo;
    video.src = src; video.onerror = () => next('radio stream error'); video.play().catch(() => {});
    log('✓ radio via the media element'); return;
  }
  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: false, manifestLoadingTimeOut: 20000, levelLoadingTimeOut: 20000, fragLoadingTimeOut: 20000, fragLoadingMaxRetry: 6, manifestLoadingMaxRetry: 4, levelLoadingMaxRetry: 6 });
    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => log(`✓ manifest parsed: ${d.levels.length} quality level(s)`));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      const why = `${d.type}: ${d.details}${d.response ? ` (HTTP ${d.response.code})` : ''}`;
      // reconnect only for a hiccup in a stream that was already playing: startLoad() cannot reload a playlist that never loaded
      // (it just hangs), and a 4xx such as 403/404 will not heal, so both fall through to the next stream/proxy at once
      const code = d.response?.code ?? 0, midStream = hls.levels?.length > 0 && !/^manifest/i.test(d.details);
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && midStream && !(code >= 400 && code < 500) && cur.netRetries < 4) { cur.netRetries++; log(`↻ ${why} — reconnecting (${cur.netRetries}/4)`); hls.startLoad(); return; }
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR && cur.mediaRetries < 2) { cur.mediaRetries++; log(`↻ ${why} — recovering`); hls.recoverMediaError(); return; }
      next(why);
    });
    hls.loadSource(src); hls.attachMedia(video);
    video.play().catch(() => {});
  } else {
    video.src = src; video.onerror = () => next('video element error'); video.play().catch(() => {});
  }
}
video.addEventListener('playing', () => {
  if (!cur) return; cur.netRetries = 0; cur.mediaRetries = 0;
  const s = cur.streams[cur.i];
  let changed = cur.failed.delete(cur.i);
  if (s && s.status !== 'ok') { // it plays, whatever the last check said: remember that (server saves it to health.json)
    s.status = 'ok'; s.checkedAt = s.lastOk = new Date().toISOString(); cur.c.alive = true; cur.c.recent = false; changed = true;
    fetch(`/api/played?u=${encodeURIComponent(s.url)}`, { method: 'POST' }).catch(() => {});
    [...list.children].forEach((li, i) => { if (view[i] === cur.c) li.querySelector('.dot').className = 'dot ok'; });
  }
  if (changed) renderStreams();
});

// ---- live / rewind ----
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function details() { const lv = hls && (hls.levels[hls.currentLevel] || hls.levels[hls.loadLevel] || hls.levels.find(l => l.details)); return lv && lv.details; }
// earliest position we can rewind to, the live position and how far behind it we are; null when not a live stream
function liveRange() {
  const b = video.buffered, t = video.currentTime;
  let start, live, tol = 8;
  if (hls) {
    const d = details();
    if (!d || !d.live || !d.fragments.length) return null;
    start = d.fragments[0].start + 1; live = hls.liveSyncPosition ?? d.edge - 3 * d.targetduration; tol = 5;
  } else if (ts) {
    if (!b.length) return null;
    start = t; live = b.end(b.length - 1) - 1;
  } else {
    const s = video.seekable;
    if (video.duration !== Infinity || !s.length) return null;
    start = s.start(0); live = s.end(s.length - 1) - 1;
  }
  for (let k = b.length - 1; k >= 0; k--) if (b.start(k) < start && b.end(k) >= start - 0.5) start = b.start(k); // plus downloaded video that joins up (back buffer)
  return { start, live, tol, behind: Math.max(0, live - t) };
}
function goLive() {
  const away = pausedAt && Date.now() - pausedAt; pausedAt = 0;
  if (cur && (ts || isRadio() ? away : away > 60000)) return reload(); // raw TS / radio or a long pause (tokens may have expired): reconnect
  const r = liveRange();
  if (r && r.live - video.currentTime > 1) { internalSeek = true; video.currentTime = r.live; }
  if (video.paused) video.play().catch(() => {});
}
function seekBy(d) {
  if (!cur) return;
  const r = liveRange(), t = video.currentTime + d;
  if (!r) { if (isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(t, video.duration)); return; } // not live
  if (d > 0) { if (t >= r.live - 1) goLive(); else video.currentTime = t; return; }
  if (t < r.start) log(`⏪ can't go further back: only ${fmt(r.live - r.start)} available so far (grows while you watch)`);
  video.currentTime = Math.max(t, Math.min(r.start, video.currentTime));
}
const togglePlay = () => { if (cur) video.paused ? video.play().catch(() => {}) : video.pause(); };
const isRadio = () => !!cur && !!cur.streams[cur.i]?.labels?.includes('Radio');
video.addEventListener('pause', () => { if (cur && video.readyState >= 2 && !video.ended && (liveRange() || isRadio())) pausedAt = Date.now(); });
video.addEventListener('play', () => { if (pausedAt) goLive(); });
video.addEventListener('seeking', () => { if (internalSeek) internalSeek = false; else if (video.paused) pausedAt = 0; }); // picked a spot while paused: resume there
function updateCtrl() {
  $('#pp').textContent = video.paused ? '▶' : '⏸';
  const r = cur && liveRange(), atLive = !!r && !video.paused && r.behind < r.tol;
  $('#live').disabled = !r; $('#live').classList.toggle('on', atLive);
  $('#behind').textContent = !r ? '' : video.paused ? (pausedAt ? 'paused · ▶ continues from live' : `paused · ${fmt(r.behind)} behind live`) : atLive ? '' : `${fmt(r.behind)} behind live`;
  $('#dvr').textContent = r ? `can go back ${fmt(Math.max(0, video.currentTime - r.start))}` : '';
}
setInterval(updateCtrl, 1000);
['play', 'pause', 'seeked', 'playing', 'emptied'].forEach(e => video.addEventListener(e, updateCtrl));
$('main').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); }); // keep focus off player buttons so Space doesn't re-press them

['#q', '#country', '#cat', '#aliveOnly'].forEach(s => $(s).addEventListener('input', render));
window.quick = (co, cat) => { $('#country').value = co; $('#cat').value = cat; $('#q').value = ''; focusIdx = 0; render(); };
let sourceFilter = null; window.quickSource = (src) => { sourceFilter = src; $('#country').value = ''; $('#cat').value = ''; $('#q').value = ''; focusIdx = 0; render(); };
['#q', '#country', '#cat'].forEach(s => $(s).addEventListener('input', () => { sourceFilter = null; }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (!(e.target.tagName === 'INPUT' && e.target.type === 'text') && !e.metaKey && !e.ctrlKey && !e.altKey) { // player keys, not while typing a search
    const act = { ' ': togglePlay, k: togglePlay, MediaPlayPause: togglePlay, l: goLive,
      ArrowLeft: () => seekBy(-10), MediaRewind: () => seekBy(-10), ArrowRight: () => seekBy(10), MediaFastForward: () => seekBy(10) }[e.key];
    if (act) { act(); e.preventDefault(); return; }
    if (cur && /^[1-9]$/.test(e.key) && cur.streams[e.key - 1]) return playStream(e.key - 1);
  }
  if (e.key === 'ArrowDown') { focusIdx = Math.min(view.length - 1, focusIdx + 1); highlight(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { focusIdx = Math.max(0, focusIdx - 1); highlight(); e.preventDefault(); }
  else if (e.key === 'Enter' && view[focusIdx]) { play(view[focusIdx]); }
  else if (e.key === 'PageDown') { focusIdx = Math.min(view.length - 1, focusIdx + 20); highlight(); }
  else if (e.key === 'PageUp') { focusIdx = Math.max(0, focusIdx - 20); highlight(); }
});
</script>
</body>
</html>
