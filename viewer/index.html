<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iptv-myapp · local viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #0b0d10; color: #e6e9ee; display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { border-right: 1px solid #1f242c; display: flex; flex-direction: column; min-height: 0; }
  .bar { padding: 10px; display: grid; gap: 8px; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #1f242c; }
  .bar input, .bar select { width: 100%; padding: 8px; background: #141821; color: inherit; border: 1px solid #2a313d; border-radius: 6px; }
  .bar input { grid-column: 1 / -1; }
  .bar label { display: flex; align-items: center; gap: 6px; color: #9aa3b2; font-size: 12px; }
  #count { padding: 4px 10px; color: #9aa3b2; font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #12161c; }
  li:hover, li.focus { background: #171c26; }
  li.active { background: #1c3a5e; }
  li img { width: 40px; height: 28px; object-fit: contain; background: #1a1f29; border-radius: 4px; flex: none; }
  li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .m { color: #8b95a7; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #3a4150; }
  .dot.ok { background: #38c172; } .dot.bad { background: #e3342f; }
  main { display: flex; flex-direction: column; min-width: 0; }
  video { width: 100%; flex: 1; background: #000; min-height: 0; }
  #info { padding: 10px 14px; border-top: 1px solid #1f242c; display: flex; gap: 16px; align-items: center; color: #9aa3b2; font-size: 13px; }
  #info b { color: #e6e9ee; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; padding: 8px 14px; color: #8b95a7; border-top: 1px solid #1f242c; }
  .tag { padding: 2px 6px; border-radius: 4px; background: #1f2937; font-size: 11px; }
  button { background: #1f2937; color: inherit; border: 1px solid #2a313d; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <div class="bar">
    <input id="q" placeholder="Search channels…  (↑↓ to move, Enter to play)" autocomplete="off">
    <select id="country"><option value="SQ">Albanian (AL + XK + sqi)</option><option value="">All countries</option></select>
    <select id="cat"><option value="">All categories</option></select>
    <label><input type="checkbox" id="aliveOnly" checked> alive only</label>
    <label><input type="checkbox" id="forceProxy"> always via proxy</label>
  </div>
  <div id="count"></div>
  <div style="padding:0 10px 8px;display:flex;gap:6px"><button onclick="quick('SQ','')">🇦🇱 Albanian</button><button onclick="quick('','sports')">⚽ Sports (all countries)</button><button onclick="quick('','news')">📰 News</button><button onclick="quickSource('rakuten')">🎬 Rakuten (free in AL)</button></div>
  <ul id="list"></ul>
</aside>
<main>
  <video id="v" controls autoplay playsinline></video>
  <div id="info"><span>Pick a channel on the left.</span></div>
  <div id="log"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js"></script>
<script>
const $ = s => document.querySelector(s);
const video = $('#v'), list = $('#list'), info = $('#info'), logEl = $('#log');
let all = [], view = [], hls = null, ts = null, active = null, focusIdx = 0;
const log = m => { logEl.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + logEl.textContent.split('\n').slice(0, 12).join('\n'); };

fetch('/api/channels').then(r => r.json()).then(d => {
  all = d;
  const countries = [...new Set(all.map(c => c.country).filter(Boolean))].sort();
  for (const c of countries) $('#country').append(new Option(c, c));
  const cats = [...new Set(all.flatMap(c => c.categories))].sort();
  for (const c of cats) $('#cat').append(new Option(c, c));
  render();
});

function render() {
  const q = $('#q').value.trim().toLowerCase(), co = $('#country').value, cat = $('#cat').value, aliveOnly = $('#aliveOnly').checked;
  view = all.filter(c => {
    if (aliveOnly && !c.alive) return false;
    if (c.isNsfw) return false;
    if (sourceFilter && !c.streams.some(s => s.source === sourceFilter)) return false;
    if (co === 'SQ') { if (!(c.country === 'AL' || c.country === 'XK' || c.languages.includes('sqi'))) return false; }
    else if (co && c.country !== co) return false;
    if (cat && !c.categories.includes(cat)) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => (b.alive - a.alive) || a.name.localeCompare(b.name));
  $('#count').textContent = `${view.length} channels`;
  list.innerHTML = '';
  const frag = document.createDocumentFragment();
  view.slice(0, 800).forEach((c, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot ${c.alive ? 'ok' : 'bad'}"></span><img loading="lazy" src="${c.logo ?? ''}" onerror="this.style.visibility='hidden'"><div class="n">${c.name}<div class="m">${c.country ?? '—'} · ${c.categories.join(', ') || '—'} · ${c.streams.length} stream${c.streams.length > 1 ? 's' : ''}</div></div>`;
    li.onclick = () => { focusIdx = i; play(c); };
    if (c === active) li.classList.add('active');
    frag.append(li);
  });
  list.append(frag);
  focusIdx = Math.min(focusIdx, Math.max(0, view.length - 1));
  highlight();
}
function highlight() { [...list.children].forEach((li, i) => li.classList.toggle('focus', i === focusIdx)); list.children[focusIdx]?.scrollIntoView({ block: 'nearest' }); }

const proxied = s => `/proxy?u=${encodeURIComponent(s.url)}${s.ua ? `&ua=${encodeURIComponent(s.ua)}` : ''}${s.ref ? `&ref=${encodeURIComponent(s.ref)}` : ''}`;

function play(c) {
  active = c; [...list.children].forEach((li, i) => li.classList.toggle('active', view[i] === c));
  const streams = [...c.streams].sort((a, b) => (b.status === 'ok') - (a.status === 'ok'));
  tryStream(c, streams, 0, $('#forceProxy').checked || !!(streams[0]?.ua || streams[0]?.ref));
}

function tryStream(c, streams, i, viaProxy) {
  if (i >= streams.length) { info.innerHTML = `<b>${c.name}</b> <span class="tag" style="background:#7f1d1d">all ${streams.length} stream(s) failed</span>`; return; }
  const s = streams[i];
  const src = viaProxy ? proxied(s) : s.url;
  if (hls) { hls.destroy(); hls = null; }
  if (ts) { ts.destroy(); ts = null; }
  video.removeAttribute('src'); video.load();
  info.innerHTML = `<b>${c.name}</b> <span class="tag">${s.quality ?? '?'}</span> <span class="tag">${s.source}</span> <span class="tag">${viaProxy ? 'via proxy' : 'direct'}</span> <span class="tag">stream ${i + 1}/${streams.length}</span> <span class="tag">${s.status ?? 'unchecked'}</span> <span style="flex:1"></span><button onclick="navigator.clipboard.writeText('${s.url.replace(/'/g, '')}')">copy URL</button>`;
  log(`▶ ${c.name} — ${viaProxy ? 'proxy' : 'direct'} — ${s.url}`);
  const next = reason => {
    log(`✖ ${reason}`);
    if (!viaProxy) tryStream(c, streams, i, true);        // same stream through proxy (fixes CORS / headers)
    else tryStream(c, streams, i + 1, $('#forceProxy').checked);  // next alternate URL
  };
  if (/\.mpd(\?|$)/i.test(s.url)) return next('DASH not supported in this viewer (AVPlay handles it on the TV)');
  if (s.source === 'local-tuner' || /\.ts(\?|$)|\/auto\/v\d+|\/stream\/channel/i.test(s.url)) { // raw MPEG-TS over HTTP (tuner): mpegts.js
    if (!(window.mpegts && mpegts.isSupported())) return next('MPEG-TS needs mpegts.js/MSE (AVPlay plays it natively on the TV)');
    ts = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: src }, { enableWorker: true, liveBufferLatencyChasing: true });
    ts.on(mpegts.Events.ERROR, (t, d) => next(`mpegts ${t}: ${d}`)); ts.attachMediaElement(video); ts.load(); video.play().catch(() => {});
    log(`✓ MPEG-TS via mpegts.js`); return;
  }
  if (/twitch\.tv/i.test(s.url)) return next('Twitch page, not supported');
  if (/youtube\.com|youtu\.be/i.test(s.url) && !viaProxy) return tryStream(c, streams, i, true); // YouTube lives resolve server-side
  if (/^rakuten:\/\//.test(s.url) && !viaProxy) return tryStream(c, streams, i, true); // Rakuten resolves server-side
  if (/^(reporttv|mcntv):\/\//.test(s.url) && !viaProxy) return tryStream(c, streams, i, true); // broadcaster session players resolve server-side
  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: false, manifestLoadingTimeOut: 12000, levelLoadingTimeOut: 12000, fragLoadingTimeOut: 15000, fragLoadingMaxRetry: 2, manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 2 });
    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => log(`✓ manifest parsed: ${d.levels.length} quality level(s)`));
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) next(`${d.type}: ${d.details}${d.response ? ` (HTTP ${d.response.code})` : ''}`); });
    hls.loadSource(src); hls.attachMedia(video);
    video.play().catch(() => {});
  } else {
    video.src = src; video.onerror = () => next('video element error'); video.play().catch(() => {});
  }
}

['#q', '#country', '#cat', '#aliveOnly'].forEach(s => $(s).addEventListener('input', render));
window.quick = (co, cat) => { $('#country').value = co; $('#cat').value = cat; $('#q').value = ''; focusIdx = 0; render(); };
let sourceFilter = null; window.quickSource = (src) => { sourceFilter = src; $('#country').value = ''; $('#cat').value = ''; $('#q').value = ''; focusIdx = 0; render(); };
['#q', '#country', '#cat'].forEach(s => $(s).addEventListener('input', () => { sourceFilter = null; }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowDown') { focusIdx = Math.min(view.length - 1, focusIdx + 1); highlight(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { focusIdx = Math.max(0, focusIdx - 1); highlight(); e.preventDefault(); }
  else if (e.key === 'Enter' && view[focusIdx]) { play(view[focusIdx]); }
  else if (e.key === 'PageDown') { focusIdx = Math.min(view.length - 1, focusIdx + 20); highlight(); }
  else if (e.key === 'PageUp') { focusIdx = Math.max(0, focusIdx - 20); highlight(); }
});
</script>
</body>
</html>
